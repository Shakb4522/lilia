<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilia GPT - Speech & AI Workspace</title>
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Libraries for generating Word documents -->
    <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?name=Lilia&background=f3f4f6&color=374151" alt="Lilia">
                <span class="user-name">Lilia</span>
                <i class="ph ph-caret-double-left toggle-icon"></i>
            </div>
            
            <nav class="nav-main">
                <a href="/" class="nav-item" id="btnGoHome"><i class="ph ph-house"></i> Home</a>
                <a href="#" class="nav-item" id="btnNewChatSidebar"><i class="ph ph-plus"></i> New Chat</a>
            </nav>

            <div class="nav-section" style="margin-top: 1rem; flex-grow: 1; overflow-y: auto; max-height: 55vh;">
                <div class="section-title">Recent Chats</div>
                <div id="recentChatsList" style="display: flex; flex-direction: column; gap: 0.25rem;">
                    <!-- Dynamically populated from MongoDB -->
                </div>
            </div>

            <div class="sidebar-footer" style="margin-top: auto; padding-top: 1rem;">
                <a href="#" class="settings-link">Settings</a>
                <i class="ph ph-dots-three"></i>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Dashboard View -->
            <div id="dashboard-view" class="view-container">
                <header class="page-header">
                    <div class="welcome-badge">Welcome, Lilia! <span class="wave">👋</span></div>
                    <h1 class="page-subtitle">How can I help you today?</h1>
                </header>

                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; color: #9ca3af;">
                    <i class="ph ph-microphone-stage" style="font-size: 4rem; margin-bottom: 1rem;"></i>
                    <p>Start recording, upload an MP3, or chat below to begin.</p>
                </div>
            </div>

            <!-- Workspace View -->
            <div id="transcript-view" class="view-container hidden" style="height: 100%; display: flex; flex-direction: column;">
                <div class="view-header" style="margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em;">Lilia GPT</h2>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button id="btnClear" title="Clear All Workspace"><i class="ph ph-trash"></i> Clear All</button>
                    </div>
                </div>





                <!-- Unified Transcription & Chat Container -->
                <div class="transcript-box" style="flex-grow: 1; height: 100%; display: flex; flex-direction: column; background: #f8fafc; padding: 1rem; border-radius: 12px; border: 1px solid var(--border-color);">
                    <div id="transcript" class="transcript-text-content" style="height: 100%; overflow-y: auto; padding-right: 0.5rem; display: flex; flex-direction: column; gap: 1rem;">
                        
                        <!-- Welcome message from AI -->
                        <div class="transcript-cell ai-cell">
                            <div class="cell-content">Hello Lilia! Upload an MP3, record audio, or simply type a question below to chat with me!</div>
                        </div>

                        <!-- Progress Bar UI -->
                        <div id="uploadProgressContainer" class="progress-container hidden" style="width: 100%; margin-top: 1rem; flex-shrink: 0;">
                            <div class="progress-header">
                                <span id="progressTitle">Uploading file...</span>
                                <span id="progressPercent">0%</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div id="progressBar" class="progress-bar-fill"></div>
                            </div>
                            <div id="progressStatus" class="progress-status">Initiating...</div>
                        </div>

                        <!-- Live dictation container -->
                        <div id="liveTextContainer" style="margin-top: auto; padding-top: 1rem; color: var(--text-secondary); font-style: italic;">
                            <span id="finalText" class="final-text"></span>
                            <span id="interimText" class="interim-text"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Input Bar -->
            <div class="bottom-bar-container" style="flex-direction: column; gap: 0.5rem;">
                <div class="input-bar">
                    <input type="file" id="fileInput" accept="audio/*" class="hidden">
                    <button id="btnAddFile" class="circle-btn plus-btn" title="Upload MP3"><i class="ph ph-plus"></i></button>
                    
                    <div class="input-field-wrapper" style="display: flex; gap: 0.5rem; background: transparent; padding: 0; box-shadow: none; align-items: center;">
                        <input type="text" id="mainChatInput" placeholder="Ask Lilia GPT anything..." style="background: white; border: 1px solid var(--border-color); border-radius: 20px; padding: 0 1.5rem; flex-grow: 1; height: 44px; font-size: 0.9rem;">
                        <select id="languageSelect" class="lang-select-bottom" style="height: 44px;">
                            <option value="en-US">English</option>
                            <option value="es-ES">Spanish</option>
                            <option value="fr-FR">French</option>
                            <option value="ar-SA">Arabic</option>
                        </select>
                        <div id="statusIndicator" class="status-indicator" style="align-self: center;">Ready</div>
                    </div>

                    <button id="btnRecord" class="circle-btn record-btn" title="Start Recording">
                        <i class="ph-fill ph-microphone"></i>
                    </button>
                </div>
                <div id="audioPlayerContainer" style="display: none; align-items: center; gap: 0.5rem; background: white; border: 1px solid #e4e4e7; border-radius: 16px; padding: 0.5rem 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); width: 100%; max-width: 768px; pointer-events: auto; font-size: 0.85rem; color: #52525b;">
                    <i class="ph ph-music-note" style="font-size: 1.15rem; color: var(--accent-blue);"></i>
                    <span id="audioFileName" style="font-weight: 500; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
                    <audio id="audioPlayer" class="hidden"></audio>
                    <button id="btnRemoveAudio" style="background: transparent; border: none; color: #ef4444; cursor: pointer; padding: 0.2rem; display: flex; align-items: center;"><i class="ph ph-x" style="font-weight: bold;"></i></button>
                </div>
            </div>
        </main>
    </div>
    <script src="/app.js"></script>
</body>
</html>
